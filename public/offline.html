<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#89584c" />
    <title>尚文番迹 · 暂时离线</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff8f1;color:#4a2925;font-family:system-ui,"Microsoft YaHei",sans-serif}.card{width:min(420px,100%);padding:40px 28px;text-align:center;background:#fff;border:1px solid #ead8cf;border-radius:36px;box-shadow:0 20px 60px rgba(91,54,45,.12)}img{width:112px;height:112px;border-radius:30px}h1{margin:20px 0 10px;font-family:Georgia,"Songti SC",serif}p{margin:0;color:#987d74;line-height:1.7}button{margin-top:24px;border:0;border-radius:999px;padding:13px 28px;background:#89584c;color:#fff;font-size:15px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="尚文番迹" />
      <h1>暂时没有网络</h1>
      <p>连接网络后再回来，云端片库就会继续同步。</p>
      <button onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
